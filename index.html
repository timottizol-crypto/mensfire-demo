<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MENSFIRE | Приложение</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1E1E1E;
            --gold: #D4AF37;
            --gold-hover: #b5952f;
            --text-main: #F5F5F5;
            --text-muted: #A0A0A0;
            --font-main: 'Montserrat', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; overflow-x: hidden; overflow-y: hidden; /* Скрываем скролл body, скроллить будем внутри экранов */ height: 100vh; width: 100vw; }
        
        /* --- SPLASH SCREEN (Загрузочный экран) --- */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        #splashScreen.hidden { opacity: 0; visibility: hidden; }
        
        .splash-logo-container {
            position: relative; display: flex; flex-direction: column; align-items: center;
            animation: logoAppear 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .splash-svg { width: 60px; height: 60px; margin-bottom: 15px; }
        .splash-title { font-size: 28px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
        .splash-title span { color: var(--gold); }
        
        .splash-greeting {
            margin-top: 15px; font-size: 14px; color: var(--text-muted); text-align: center; padding: 0 20px;
            opacity: 0; animation: fadeIn 1s ease 0.8s forwards;
        }
        .splash-greeting span { color: var(--gold); font-weight: 800; }

        .splash-loader {
            position: absolute; bottom: -60px; width: 150px; height: 3px; background: #222; border-radius: 3px; overflow: hidden;
        }
        .splash-loader-bar {
            width: 0%; height: 100%; background: var(--gold);
            animation: loadBar 2.5s ease-in-out forwards;
        }

        @keyframes logoAppear { 0% { opacity: 0; transform: scale(0.8) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes loadBar { 0% { width: 0%; } 100% { width: 100%; } }

        /* --- ОСНОВНОЙ ИНТЕРФЕЙС ПРИЛОЖЕНИЯ --- */
        #appContainer {
            height: 100vh; width: 100vw; display: flex; flex-direction: column; position: relative;
        }

        /* Верхняя шапка (мини) */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid rgba(255,255,255,0.05);
            position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
        }
        .app-header .logo { font-size: 18px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .app-header .logo svg { width: 20px; height: 20px; }
        .app-header .logo span { color: var(--gold); }

        /* Контейнеры экранов */
        .view {
            display: none; flex-direction: column; flex-grow: 1;
            padding: 70px 20px 80px 20px; /* Отступы под шапку и нижнее меню */
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            animation: viewFadeIn 0.3s ease forwards;
        }
        .view.active { display: flex; }
        @keyframes viewFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- НИЖНЕЕ МЕНЮ (Bottom Navigation) --- */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70px;
            background: #151515; border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; width: 33%; height: 100%;
        }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }
        .nav-item.active { color: var(--gold); }
        
        /* Центральная кнопка "Записаться" */
        .nav-item-center {
            position: relative; top: -15px; width: 60px; height: 60px;
            background: var(--gold); border-radius: 50%; color: #000;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        .nav-item-center svg { width: 28px; height: 28px; margin-bottom: 0; }
        .nav-item-center-text { position: absolute; bottom: 8px; font-size: 9px; font-weight: 800; color: var(--text-muted); }

        /* --- ЭКРАН: ЗАПИСЬ --- */
        .category-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: var(--bg-card); border: 1px solid #333; color: var(--text-main); padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600; transition: all 0.3s; }
        .tab-btn.active { background: var(--gold); border-color: var(--gold); color: #000; }

        .services-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .service-card { background: var(--bg-card); border-radius: 12px; padding: 15px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .service-card.selected { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        .service-card-info h3 { font-size: 14px; margin-bottom: 4px; }
        .service-card-info .time { font-size: 11px; color: var(--text-muted); }
        .service-card-price { font-size: 16px; font-weight: 800; color: var(--gold); }
        .service-card .checkbox { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--text-muted); display: flex; justify-content: center; align-items: center; }
        .service-card.selected .checkbox { border-color: var(--gold); background: var(--gold); }
        .service-card.selected .checkbox::after { content: '✓'; color: #000; font-weight: bold; font-size: 10px; }

        .masters-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .master-card { background: var(--bg-card); border-radius: 12px; padding: 15px; border: 1px solid #333; text-align: center; transition: all 0.2s; }
        .master-card.selected { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        .master-card .icon { font-size: 30px; margin-bottom: 10px; }
        .master-card h3 { font-size: 14px; margin-bottom: 3px; }
        .master-card p { font-size: 10px; color: var(--gold); text-transform: uppercase; }

        /* Выбор даты и времени (упрощенно для мобилки) */
        .date-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .date-item { min-width: 60px; padding: 10px; background: var(--bg-card); border-radius: 10px; border: 1px solid #333; text-align: center; }
        .date-item.selected { border-color: var(--gold); background: var(--gold); color: #000; }
        .date-item .day { font-size: 10px; opacity: 0.8; }
        .date-item .num { font-size: 16px; font-weight: bold; }

        .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .time-item { padding: 8px; text-align: center; background: var(--bg-card); border-radius: 8px; border: 1px solid #333; font-size: 12px; }
        .time-item.selected { border-color: var(--gold); background: var(--gold); color: #000; font-weight: bold; }
        .time-item.disabled { opacity: 0.3; text-decoration: line-through; }

        .checkout-bar { position: fixed; bottom: 70px; left: 0; width: 100%; background: #151515; padding: 15px 20px; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 90; }
        .checkout-total { font-size: 16px; font-weight: bold; }
        .checkout-total span { color: var(--gold); }
        .checkout-btn { background: var(--gold); color: #000; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 800; font-size: 14px; }

        /* --- ЭКРАН: ПРОФИЛЬ --- */
        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(212, 175, 55, 0.1); border: 2px solid var(--gold); margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 30px; }
        .profile-header h1 { font-size: 22px; }
        .profile-header p { color: var(--text-muted); font-size: 14px; }

        .loyalty-card { background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, #1E1E1E 100%); border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 20px; padding: 20px; margin-bottom: 20px; position: relative; overflow: hidden; }
        .loyalty-card h2 { font-size: 14px; color: var(--gold); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .loyalty-level { font-size: 24px; font-weight: 800; margin-bottom: 15px; }
        .progress-bar-bg { height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar-fill { height: 100%; background: var(--gold); width: 0%; transition: width 1s ease; }
        .loyalty-hint { font-size: 12px; color: var(--text-muted); }

        .qr-btn { width: 100%; background: var(--bg-card); border: 1px solid var(--gold); color: var(--gold); padding: 15px; border-radius: 12px; font-weight: bold; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; }
        .logout-btn { width: 100%; background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 14px; }

        /* --- ЭКРАН: МОИ ЗАПИСИ --- */
        .active-booking-card { background: #1E1E1E; border: 1px solid var(--gold); border-radius: 16px; padding: 20px; margin-bottom: 25px; position: relative; }
        .active-booking-card::before { content: 'Ближайший визит'; position: absolute; top: -10px; left: 20px; background: var(--gold); color: #000; font-size: 10px; font-weight: bold; padding: 2px 10px; border-radius: 10px; text-transform: uppercase; }
        .ab-date { font-size: 20px; font-weight: 800; color: var(--gold); margin-bottom: 10px; }
        .ab-master { font-size: 14px; margin-bottom: 15px; }
        .ab-services { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .ab-actions { display: flex; gap: 10px; }
        .ab-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; text-align: center; border: none; }
        .ab-btn.cancel { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid #ff4d4d; }
        .ab-btn.reschedule { background: var(--gold); color: #000; }

        .history-title { font-size: 16px; margin-bottom: 15px; color: var(--text-muted); }
        .history-card { background: var(--bg-card); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #333; }
        .history-info h3 { font-size: 14px; }
        .history-info p { font-size: 12px; color: var(--text-muted); }
        .history-price { font-weight: bold; color: var(--gold); font-size: 14px; }

        /* Модалки (упрощенные) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); padding: 30px 20px; border-radius: 20px; width: 90%; text-align: center; border: 1px solid var(--gold); }
        .modal-content input { width: 100%; padding: 15px; background: #121212; border: 1px solid #333; border-radius: 10px; color: #fff; margin-bottom: 15px; text-align: center; font-size: 16px; }
        .modal-btn { width: 100%; padding: 15px; background: var(--gold); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <!-- ЗАГРУЗОЧНЫЙ ЭКРАН (SPLASH) -->
    <div id="splashScreen">
        <div class="splash-logo-container">
            <svg class="splash-svg" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
            <div class="splash-title">MEN<span>FIRE</span></div>
            <div class="splash-greeting" id="splashGreeting">Добро пожаловать в премиальный барбершоп</div>
            <div class="splash-loader"><div class="splash-loader-bar"></div></div>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="appContainer">
        
        <!-- Мини-шапка -->
        <div class="app-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
                MENS<span>FIRE</span>
            </div>
            <div style="font-size: 12px; color: var(--gold); cursor: pointer;" onclick="openAuth()" id="headerAuthBtn">Войти</div>
        </div>

        <!-- ЭКРАН 1: ЗАПИСЬ (Открывается по умолчанию или по кнопке) -->
        <div id="viewBook" class="view active">
            <h2 style="margin-bottom: 15px; font-size: 20px;">Записаться</h2>
            
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterServices('top', this)">ТОП-БАРБЕР</button>
                <button class="tab-btn" onclick="filterServices('barber', this)">БАРБЕР</button>
            </div>
            
            <div class="services-grid" id="servicesGrid">
                <!-- Услуги рендерятся через JS -->
            </div>

            <h3 style="margin: 25px 0 10px; font-size: 16px; color: var(--gold);">Выберите мастера</h3>
            <div class="masters-grid" id="mastersGrid">
                <!-- Мастера рендерятся через JS -->
            </div>

            <div id="dateTimeSection" style="display: none; margin-top: 25px;">
                <h3 style="margin-bottom: 10px; font-size: 16px; color: var(--gold);">Дата и время</h3>
                <div class="date-scroll" id="dateScroll"></div>
                <div class="time-grid" id="timeGrid"></div>
            </div>
        </div>

        <!-- ЭКРАН 2: МОИ ЗАПИСИ -->
        <div id="viewBookings" class="view">
            <h2 style="margin-bottom: 20px; font-size: 20px;">Мои записи</h2>
            
            <div id="activeBookingContainer">
                <!-- Активная запись рендерится через JS -->
            </div>

            <h3 class="history-title">История визитов</h3>
            <div id="historyContainer">
                <!-- История рендерится через JS -->
            </div>
        </div>

        <!-- ЭКРАН 3: ЛИЧНЫЙ КАБИНЕТ -->
        <div id="viewProfile" class="view">
            <div class="profile-header" id="profileHeader">
                <!-- Рендерится через JS -->
            </div>

            <div class="loyalty-card" id="loyaltyCard" style="display: none;">
                <h2>Ваш статус</h2>
                <div class="loyalty-level" id="loyaltyLevelName">Новичок</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="loyaltyProgress"></div>
                </div>
                <div class="loyalty-hint" id="loyaltyHint">До следующего уровня осталось 3 визита</div>
            </div>

            <button class="qr-btn" id="qrBtn" style="display: none;" onclick="alert('Здесь будет ваш QR-код для отметки в барбершопе.')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Мой QR-код
            </button>

            <button class="logout-btn" id="logoutBtn" style="display: none;" onclick="logout()">Выйти из аккаунта</button>
            <button class="modal-btn" id="loginBtnProfile" onclick="openAuth()">Войти / Зарегистрироваться</button>
        </div>

        <!-- НИЖНЕЕ МЕНЮ -->
        <div class="bottom-nav">
            <div class="nav-item" onclick="switchView('viewProfile', this)" id="navProfile">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Профиль
            </div>
            <div class="nav-item nav-item-center" onclick="switchView('viewBook', this)" id="navBook">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            </div>
            <div class="nav-item" onclick="switchView('viewBookings', this)" id="navBookings">
                <svg viewBox="0 0 24 24"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
                Записи
            </div>
        </div>

        <!-- ПАНЕЛЬ ОФОРМЛЕНИЯ (Появляется, если выбраны услуги) -->
        <div class="checkout-bar" id="checkoutBar" style="display: none;">
            <div class="checkout-total">Итого: <span id="totalPrice">0</span> ₽</div>
            <button class="checkout-btn" onclick="submitBooking()">Записаться</button>
        </div>
    </div>

    <!-- МОДАЛКА АВТОРИЗАЦИИ -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 15px;">Вход</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Введите номер телефона</p>
            <input type="tel" id="phoneInput" placeholder="+7 (999) 000-00-00">
            <button class="modal-btn" onclick="sendCode()">Получить код</button>
        </div>
    </div>

    <!-- МОДАЛКА КОДА -->
    <div class="modal" id="codeModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 15px;">Введите код</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Демо-код: <b>1234</b></p>
            <input type="text" id="codeInput" placeholder="0000" maxlength="4" style="letter-spacing: 10px; font-size: 24px;">
            <button class="modal-btn" onclick="verifyCode()">Подтвердить</button>
        </div>
    </div>

    <script>
        // --- ДАННЫЕ ---
        const servicesData = {
            top: [
                { id: 't1', title: 'Мужская стрижка', time: '45 мин', price: 1500, type: 'top' },
                { id: 't2', title: 'Стрижка + борода', time: '1 ч', price: 2500, type: 'top' },
                { id: 't3', title: 'Оформление бороды', time: '30 мин', price: 1200, type: 'top' }
            ],
            barber: [
                { id: 'b1', title: 'Мужская стрижка', time: '45 мин', price: 1000, type: 'barber' },
                { id: 'b2', title: 'Стрижка машинкой', time: '30 мин', price: 800, type: 'barber' },
                { id: 'b3', title: 'Бритье', time: '30 мин', price: 1000, type: 'barber' }
            ]
        };

        const barbersData = [
            { id: 'b_al', name: 'Али', role: 'ТОП', icon: '👨‍🦱', type: 'top' },
            { id: 'b_ben', name: 'Бенджо', role: 'Барбер', icon: '👨‍🦰', type: 'barber' },
            { id: 'b_ism', name: 'Исмаил', role: 'Барбер', icon: '👨‍🦲', type: 'barber' }
        ];

        // Состояние
        let cart = [];
        let selectedBarber = null;
        let selectedDate = null;
        let selectedTime = null;
        let currentUser = JSON.parse(localStorage.getItem('menfire_user')) || null;
        let bookings = JSON.parse(localStorage.getItem('menfire_bookings')) || [];

        // --- ЛОГИКА SPALSH SCREEN ---
        window.addEventListener('DOMContentLoaded', () => {
            // Приветствие на сплэше
            const splashGreeting = document.getElementById('splashGreeting');
            if (currentUser) {
                splashGreeting.innerHTML = `Здравствуйте, <span>${currentUser.name}</span>!<br>Пора обновить стрижку?`;
            }

            // Скрываем сплэш через 2.5 секунды
            setTimeout(() => {
                document.getElementById('splashScreen').classList.add('hidden');
                updateAuthUI();
                renderServices('top');
                renderMasters();
                renderBookings();
            }, 2500);
        });

        // --- НАВИГАЦИЯ (Переключение экранов) ---
        function switchView(viewId, navElement) {
            // Скрываем все экраны
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            // Показываем нужный
            document.getElementById(viewId).classList.add('active');
            
            // Меняем активную иконку в меню
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(navElement) navElement.classList.add('active');

            // Скрываем панель оформления, если ушли с экрана записи
            if (viewId !== 'viewBook') {
                document.getElementById('checkoutBar').style.display = 'none';
            } else if (cart.length > 0) {
                document.getElementById('checkoutBar').style.display = 'flex';
            }
        }

        // --- АВТОРИЗАЦИЯ ---
        function openAuth() { document.getElementById('authModal').classList.add('active'); }
        function sendCode() {
            const phone = document.getElementById('phoneInput').value;
            if(!phone) return alert("Введите телефон");
            document.getElementById('authModal').classList.remove('active');
            document.getElementById('codeModal').classList.add('active');
        }
        function verifyCode() {
            const code = document.getElementById('codeInput').value;
            if(code === '1234') {
                currentUser = { name: 'Тимофей', phone: '+7 (999) 123-45-67' }; // Имитация
                localStorage.setItem('menfire_user', JSON.stringify(currentUser));
                document.getElementById('codeModal').classList.remove('active');
                updateAuthUI();
                renderBookings();
                alert('Успешный вход!');
            } else {
                alert('Неверный код (1234)');
            }
        }
        function logout() {
            localStorage.removeItem('menfire_user');
            currentUser = null;
            updateAuthUI();
            renderBookings();
            switchView('viewBook', document.getElementById('navBook'));
        }

        function updateAuthUI() {
            if(currentUser) {
                document.getElementById('headerAuthBtn').style.display = 'none';
                document.getElementById('loginBtnProfile').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('qrBtn').style.display = 'flex';
                document.getElementById('loyaltyCard').style.display = 'block';
                document.getElementById('profileHeader').innerHTML = `
                    <div class="profile-avatar">👤</div>
                    <h1>${currentUser.name}</h1>
                    <p>${currentUser.phone}</p>
                `;
                // Обновляем уровень
                const count = bookings.length;
                document.getElementById('loyaltyLevelName').innerText = count < 3 ? 'Новичок' : 'Постоянный';
                document.getElementById('loyaltyProgress').style.width = `${(count%3)*33.3}%`;
            } else {
                document.getElementById('headerAuthBtn').style.display = 'block';
                document.getElementById('loginBtnProfile').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('qrBtn').style.display = 'none';
                document.getElementById('loyaltyCard').style.display = 'none';
                document.getElementById('profileHeader').innerHTML = `
                    <div class="profile-avatar">👤</div>
                    <h1>Гость</h1>
                    <p>Войдите, чтобы видеть записи</p>
                `;
            }
        }

        // --- РЕНДЕР УСЛУГ ---
        function renderServices(category) {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';
            servicesData[category].forEach(service => {
                const isSelected = cart.some(item => item.id === service.id);
                const div = document.createElement('div');
                div.className = `service-card ${isSelected ? 'selected' : ''}`;
                div.innerHTML = `
                    <div class="service-card-info">
                        <h3>${service.title}</h3>
                        <div class="time">${service.time}</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="service-card-price">${service.price} ₽</div>
                        <div class="checkbox"></div>
                    </div>
                `;
                div.onclick = () => toggleService(service);
                grid.appendChild(div);
            });
            updateTotal();
        }

        function filterServices(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderServices(cat);
            checkMasterAvailability();
        }

        function toggleService(service) {
            const index = cart.findIndex(item => item.id === service.id);
            if (index === -1) {
                if(cart.length > 0 && cart[0].type !== service.type) {
                    cart = []; // Сброс при смене категории
                    selectedBarber = null;
                }
                cart.push(service);
            } else {
                cart.splice(index, 1);
            }
            renderServices(service.type);
            checkMasterAvailability();
        }

        function updateTotal() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('totalPrice').innerText = total;
            if(cart.length > 0) {
                document.getElementById('checkoutBar').style.display = 'flex';
            } else {
                document.getElementById('checkoutBar').style.display = 'none';
            }
        }

        // --- РЕНДЕР МАСТЕРОВ ---
        function renderMasters() {
            const grid = document.getElementById('mastersGrid');
            grid.innerHTML = '';
            const hasTop = cart.some(i => i.type === 'top');
            
            barbersData.forEach(barber => {
                if(hasTop && barber.type !== 'top') return;
                if(!hasTop && cart.length > 0 && barber.type === 'top') return; // Если обычные услуги, скрываем ТОПа

                const div = document.createElement('div');
                div.className = `master-card ${selectedBarber?.id === barber.id ? 'selected' : ''}`;
                div.innerHTML = `
                    <div class="icon">${barber.icon}</div>
                    <h3>${barber.name}</h3>
                    <p>${barber.role}</p>
                `;
                div.onclick = () => {
                    selectedBarber = barber;
                    renderMasters();
                    document.getElementById('dateTimeSection').style.display = 'block';
                    renderDates();
                };
                grid.appendChild(div);
            });
        }

        function checkMasterAvailability() {
            if(cart.length === 0) {
                selectedBarber = null;
                document.getElementById('dateTimeSection').style.display = 'none';
            }
            renderMasters();
        }

        // --- ДАТА И ВРЕМЯ ---
        function renderDates() {
            const container = document.getElementById('dateScroll');
            container.innerHTML = '';
            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            
            for(let i=0; i<5; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dateStr = d.toLocaleDateString('ru-RU');
                
                const div = document.createElement('div');
                div.className = `date-item ${selectedDate === dateStr ? 'selected' : ''}`;
                div.innerHTML = `<div class="day">${i===0?'Сегодня':days[d.getDay()]}</div><div class="num">${d.getDate()}</div>`;
                div.onclick = () => {
                    selectedDate = dateStr;
                    selectedTime = null;
                    renderDates();
                    renderTimes();
                };
                container.appendChild(div);
            }
        }

        function renderTimes() {
            const container = document.getElementById('timeGrid');
            container.innerHTML = '';
            const times = ['10:00', '11:30', '13:00', '14:30', '16:00', '17:30', '19:00'];
            
            times.forEach(time => {
                // Имитация занятого времени (для примера)
                const isBooked = time === '13:00'; 
                const div = document.createElement('div');
                div.className = `time-item ${selectedTime === time ? 'selected' : ''} ${isBooked ? 'disabled' : ''}`;
                div.innerText = time;
                if(!isBooked) {
                    div.onclick = () => {
                        selectedTime = time;
                        renderTimes();
                    };
                }
                container.appendChild(div);
            });
        }

        // --- ОФОРМЛЕНИЕ ---
        function submitBooking() {
            if(cart.length === 0) return alert("Выберите услуги");
            if(!selectedBarber) return alert("Выберите мастера");
            if(!selectedDate || !selectedTime) return alert("Выберите дату и время");
            if(!currentUser) return openAuth();

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const newBooking = {
                id: Date.now(),
                services: [...cart],
                barber: selectedBarber,
                date: selectedDate,
                time: selectedTime,
                total: total
            };

            bookings.push(newBooking);
            localStorage.setItem('menfire_bookings', JSON.stringify(bookings));
            
            cart = [];
            selectedBarber = null;
            selectedDate = null;
            selectedTime = null;

            renderServices('top');
            checkMasterAvailability();
            updateTotal();
            updateAuthUI(); // Обновить прогресс уровня
            
            alert('Вы успешно записаны!');
            switchView('viewBookings', document.getElementById('navBookings'));
        }

        // --- РЕНДЕР ЗАПИСЕЙ ---
        function renderBookings() {
            const activeContainer = document.getElementById('activeBookingContainer');
            const historyContainer = document.getElementById('historyContainer');
            
            if(!currentUser || bookings.length === 0) {
                activeContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px 0;">У вас пока нет записей</div>`;
                historyContainer.innerHTML = '';
                return;
            }

            // Ближайшая запись (для простоты берем последнюю созданную)
            const next = bookings[bookings.length - 1];
            activeContainer.innerHTML = `
                <div class="active-booking-card">
                    <div class="ab-date">${next.date} в ${next.time}</div>
                    <div class="ab-master">Мастер: <b>${next.barber.name}</b></div>
                    <div class="ab-services">${next.services.map(s => s.title).join(', ')}</div>
                    <div class="ab-actions">
                        <button class="ab-btn cancel" onclick="cancelBooking(${next.id})">Отменить</button>
                        <button class="ab-btn reschedule" onclick="alert('Логика переноса в разработке')">Перенести</button>
                    </div>
                </div>
            `;

            historyContainer.innerHTML = bookings.slice(0, -1).reverse().map(b => `
                <div class="history-card">
                    <div class="history-info">
                        <h3>${b.date} • ${b.time}</h3>
                        <p>${b.barber.name} — ${b.services.map(s => s.title).join(', ')}</p>
                    </div>
                    <div class="history-price">${b.total} ₽</div>
                </div>
            `).join('');
        }

        function cancelBooking(id) {
            if(confirm('Точно отменить запись?')) {
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('menfire_bookings', JSON.stringify(bookings));
                renderBookings();
                updateAuthUI();
            }
        }
    </script>
</body>
</html>
